<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Halaman tidak ditemukan — TeleCare</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%23049A5B'/><path d='M5 17h5l2.4-6 3.6 12 2.8-8 1.8 2H27' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box}
  body{
    margin:0;min-height:100svh;display:grid;place-items:center;padding:40px 24px;
    font-family:"Plus Jakarta Sans",system-ui,sans-serif;color:#08201A;
    background:
      radial-gradient(120% 90% at 78% 10%,rgba(14,127,184,.10),transparent 55%),
      radial-gradient(90% 80% at 8% 94%,rgba(4,154,91,.12),transparent 60%),
      #EFF6F2;
    text-align:center;overflow:hidden;
  }
  .grid{
    position:fixed;inset:0;pointer-events:none;opacity:.6;
    background-image:
      linear-gradient(rgba(4,154,91,.06) 1px,transparent 1px),
      linear-gradient(90deg,rgba(4,154,91,.06) 1px,transparent 1px);
    background-size:56px 56px;
    -webkit-mask-image:radial-gradient(70% 60% at 50% 45%,#000,transparent);
    mask-image:radial-gradient(70% 60% at 50% 45%,#000,transparent);
  }
  main{position:relative;max-width:560px}
  .flat{width:min(100%,460px);height:110px;margin:0 auto 8px;overflow:visible}
  .flat path{
    fill:none;stroke:#049A5B;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;
    stroke-dasharray:900;stroke-dashoffset:900;animation:draw 2s cubic-bezier(.4,0,.2,1) .1s forwards;
  }
  @keyframes draw{to{stroke-dashoffset:0}}
  .code{
    font-family:"JetBrains Mono",monospace;font-size:.72rem;letter-spacing:.32em;
    text-transform:uppercase;color:#03804C;background:#D6F2E3;border:1px solid #A9E5C8;
    display:inline-flex;align-items:center;gap:9px;padding:7px 16px;border-radius:999px;margin-bottom:22px;
  }
  .code i{width:7px;height:7px;border-radius:50%;background:#049A5B;animation:blink 1.6s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
  h1{font-size:clamp(1.7rem,4vw,2.5rem);letter-spacing:-.035em;margin:0 0 14px;line-height:1.12}
  p{margin:0 auto;max-width:44ch;color:#274F42;line-height:1.62;font-size:1rem}
  .btn{
    display:inline-flex;align-items:center;gap:10px;margin-top:30px;
    padding:14px 26px;border-radius:999px;background:#049A5B;color:#fff;
    font-weight:700;text-decoration:none;box-shadow:0 6px 18px rgba(4,154,91,.3);
    transition:transform .35s cubic-bezier(.22,.68,.36,1),box-shadow .35s;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(4,154,91,.4)}
  .btn svg{width:18px;height:18px}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}.flat path{stroke-dashoffset:0}}
</style>
</head>
<body>
<div class="grid"></div>
<main>
  <svg class="flat" viewBox="0 0 460 110" aria-hidden="true">
    <path d="M6 62h104l18-30 26 60 20-46 14 16h32"/>
    <path d="M226 62h228"/>
  </svg>
  <span class="code"><i></i> Sinyal 404 · tidak terbaca</span>
  <h1>Halaman ini tidak terpantau.</h1>
  <p>Alamat yang Anda tuju tidak ada di TeleCare. Kembali ke beranda untuk menelusuri perangkat,
     arsitektur sistem, dan dashboard pemantauan.</p>
  <a class="btn" href="/">Kembali ke beranda
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 12h13M13 6.6 18.4 12 13 17.4"/>
    </svg>
  </a>
</main>
</body>
</html>
